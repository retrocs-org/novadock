OPTION.MUSIC.EAGLE_QUERY_TIME=
OPTION.MUSIC.EAGLE_VOL_UP=
OPTION.MUSIC.EAGLE_VOL_DOWN=
OPTION.MUSIC.AMIGAAMP_PORT=AMIGAAMP
OPTION.MUSIC.AMIGAAMP_PORT_ALT=AMIGAAMP.1
# HippoPlayer 2.47+ verified against its public ARexx source interface.
OPTION.MUSIC.HIPPO_PORT=HIPPOPLAYER
OPTION.MUSIC.HIPPO_PORT_ALT=HIPPOPLAYER
OPTION.MUSIC.HIPPO_PLAY=CONT
OPTION.MUSIC.HIPPO_PAUSE=STOP
OPTION.MUSIC.HIPPO_STOP=STOP
OPTION.MUSIC.HIPPO_PREVIOUS=CHOOSEPREV
