# NovaDock 0.1 - AmigaOS 3.x / Workbench
# Order controls tile order. PLUGIN id must be unique, ASCII letters/digits/_/-.
SIDE=BOTTOM
POSITION=CENTER
FONT=WORKBENCH
LABELS=ALWAYS
ITEM_SIZE=NORMAL
THEME=Nord
SHAPE=ROUNDED
TILE_WIDTH=86
TILE_HEIGHT=76
GAP=5
ROWS=1
# AUTO balances rows until the first explicit row move. NovaDock then saves
# one item count per row, preserving empty and single-item rows.
ROW_COUNTS=AUTO
# Left-click launches apps/drawers. Right-click opens their action menu.
LEFT_CLICK=LAUNCH
TOOLTIPS=YES
# Classic Workbench has no topmost flag; NovaDock can periodically move its layer forward.
ALWAYS_ON_TOP=NO
RUNNING_APPS=YES
# Show inserted floppies, memory cards and USB sticks as temporary tiles.
REMOVABLE_MEDIA=YES
# Taskbar: also show running applications that have no launcher.
RUNNING_SECTION=NO
# Drawer popups: ICONS grid or LIST; sorted by NAME, DATE or SIZE.
FOLDER_VIEW=ICONS
FOLDER_SORT=NAME
# Low memory is safest on classic/planar systems; Smooth uses a backing bitmap.
REFRESH_MODE=LOW_MEMORY
# Enable the low-overhead edge tab after 3 seconds away from the dock.
AUTO_HIDE=NO
HIDE_DELAY=3
# SYS: always resolves to the disk Workbench booted from.
DRAWER=System|SYS:|SYS:Disk|ON|AUTO||||NO|YES
# NewShell uses the installation's configured default shell.
LAUNCH=Shell|NewShell|SYS:System/Shell|ON|AUTO
PLUGIN=MusicPlayer|Plugins/MusicPlayer|MUSIC|METER|ON
PLUGIN=CPU|Plugins/Activity|CPU|METER|ON
PLUGIN=RAM|Plugins/Memory|RAM|METER|ON
PLUGIN=Clock|Plugins/Clock|CLOCK|METER|ON
PLUGIN=Network|Plugins/Network|NET|METER|OFF
PLUGIN=Eyes|Plugins/Eyes|EYES|METER|OFF
PLUGIN=DOpus 4|Plugins/DOpus4|DOPUS4|METER|OFF
PLUGIN=Extract|Plugins/ArchiveExtractor|ARCHIVE|METER|OFF
PLUGIN=Running Apps|Plugins/RunningApps|RUNNINGAPPS|METER|OFF
PLUGIN=Trash|Plugins/Trash|TRASH|METER|OFF
PLUGIN=WHDLoad Games|Plugins/Games|WHDLOAD|METER|OFF
# Command-output tile example (enable it in Preferences > Dock Bar). Add more
# from the dock background menu with "Add command tile...".
PLUGIN=Kickstart|Plugins/Command|KICKSTART|METER|OFF
PLUGIN=AmIRC|Plugins/AmIRC|AMIRC|METER|OFF
PLUGIN=Clippy|Plugins/Clipboard|CLIPBOARD|METER|OFF

# All plugin settings live HERE. No Plugins/*.cfg files are used.
# Open a plugin tile's right-click menu -> Change settings... to edit these.
OPTION.CLOCK.FORMAT=DIGITAL
OPTION.CLOCK.HOUR_MODE=24
OPTION.CLOCK.SECONDS=NO
OPTION.CLOCK.POLL_TICKS=50
# Eyes: native xeyes-inspired widget, no X11 or RTG required.
OPTION.EYES.SIZE=NORMAL
OPTION.EYES.EYE_COLOR=WHITE
OPTION.EYES.PUPIL_COLOR=DARK
OPTION.EYES.SENSITIVITY=100
OPTION.EYES.SHOW_LABEL=NO
OPTION.EYES.BLINK=YES
OPTION.EYES.POLL_TICKS=20
OPTION.CPU.POLL_TICKS=50
OPTION.RAM.POLL_TICKS=50
OPTION.NET.STACK=AUTO
OPTION.NET.INTERFACE=AUTO
OPTION.NET.DHCP_TIMEOUT=60
OPTION.NET.DEVICE=
OPTION.NET.UNIT=0
OPTION.NET.SCALE_PPS=250
OPTION.NET.POLL_TICKS=50
OPTION.DOPUS4.PORT=DOPUS.1
OPTION.DOPUS4.ALT_PORT=DOPUS
OPTION.DOPUS4.RESTORE_COMMAND=UNICONIFY
OPTION.DOPUS4.FRONT_COMMAND=DOPUSTOFRONT
OPTION.DOPUS4.PROGRAM=SYS:DirOpus4/DirectoryOpus
OPTION.DOPUS4.CONFIG=
OPTION.DOPUS4.POLL_TICKS=25
OPTION.ARCHIVE.POLL_TICKS=10
OPTION.MUSIC.MODE=AUTO
OPTION.MUSIC.PREFER=EAGLEPLAYER
OPTION.MUSIC.DEFAULT_APP=
OPTION.MUSIC.POLL_TICKS=100
OPTION.MUSIC.AUTO_QUERY=YES
